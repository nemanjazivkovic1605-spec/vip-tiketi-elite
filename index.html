    <link rel="manifest" href="/manifest.json" />

    <meta data-site-fallback="true" property="og:title" content="Elite VIP Tips | Fudbalska statistika i sportski tipovi" />
    <meta data-site-fallback="true" property="og:description" content="Raspored, rezultati, Match Finder i transparentna istorija sportskih tipova." />

    <meta data-site-fallback="true" property="og:type" content="website" />

    <style>
      html, body, #root {
        min-height: 100%;
        background-color: #050505 !important;
        color: #f5f5f5 !important;
      }
      body {
        background-image: none !important;
        margin: 0;
      }
    </style>
    <script>
      try {
        const themeKeys = ['theme', 'colorMode', 'color-scheme', 'themeMode'];
        themeKeys.forEach((key) => {
          const value = localStorage.getItem(key);
          if (value && value.toLowerCase().includes('light')) {
            localStorage.setItem(key, 'dark');
          }
        });
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
      } catch (error) {
        // ignore localStorage access errors on older browsers
      }
    </script>
    <!-- Lucide is used via npm/vite, no need for CDN here -->
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
